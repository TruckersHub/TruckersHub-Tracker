<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
            font-family: Segoe UI, sans-serif;
        }

        .bar {
            width: 100%;
            height: 16px;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 15px;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.2s ease;
        }

        .text {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="text" id="label">Downloading update… 0%</div>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>

    <script>
        const fill = document.getElementById("fill");
        const label = document.getElementById("label");

        window.progress.onUpdate(percent => {
            fill.style.width = percent + "%";
            label.textContent = `Downloading update… ${percent}%`;
        });
    </script>

</body>

</html>
